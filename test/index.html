<title>Bible Games</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">

<meta name="theme-color" content="#0f8a8c">
<style>
:root{--bg:#f2f8f8;--surface:#fff;--ink:#16302f;--muted:#5b7473;--line:#cfe0df;--accent:#0f8a8c;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1b;--surface:#172526;--ink:#e2f0ef;--muted:#93aeac;--line:#2c4142;--accent:#4fd1c5;--bad:#ef8a78}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font:700 1.5rem Georgia,serif;margin:0 0 6px}
p{margin:0 0 14px;color:var(--muted);font-size:.95rem}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:12px}
button{width:100%;font:600 1rem system-ui,sans-serif;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:10px 0 0}
#wait{color:var(--muted)}
</style>
</head>
<body>
<p id="wait">Loading…</p>
<form id="f" hidden>
  <h1>Bible Games</h1>
  <p>Enter the password to play. This phone will remember it.</p>
  <label for="pw" style="position:absolute;left:-9999px">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Password" required>
  <button id="go">Open the games</button>
  <p class="err" id="err" role="alert"></p>
</form>

async function keyFrom(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(LOCK.salt),iterations:LOCK.iter,hash:"SHA-256"},base,256));
}

  const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  /* Keep the site icon and app details when the unlocked page replaces this one */
  const keep=[...document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"],link[rel="manifest"],meta[name="theme-color"]')].map(e=>e.outerHTML).join("");
  document.open(); document.write(html.replace(/<head>/i,"<head>"+keep)); document.close();
}
const toB64=u=>{ let s=""; u.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
(async()=>{
  const saved=store.get();
  if(saved){ try{ await open(b64(saved)); return; }catch(e){ store.del(); } }
  document.getElementById("wait").hidden=true;
  const f=document.getElementById("f"), pw=document.getElementById("pw"), err=document.getElementById("err"), go=document.getElementById("go");
  f.hidden=false; pw.focus();
  f.onsubmit=async e=>{
    e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Opening…";
    try{ const raw=await keyFrom(pw.value.trim()); await open(raw); store.set(toB64(raw)); }
    catch(x){ err.textContent="That password isn’t right. Please try again."; go.disabled=false; go.textContent="Open the games"; pw.select(); }
  };
})();
